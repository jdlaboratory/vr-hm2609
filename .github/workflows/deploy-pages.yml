name: Deploy to GitHub Pages

# The tour is a static site with no build step, so this workflow publishes the
# repository nearly as-is: the one thing it does first is stamp a version onto
# the site's own code URLs, so a returning visitor cannot run the new
# index.html against a cached copy of the old stylesheet. Every push to main
# redeploys it.
on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you redeploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling, so the last
# push always ends up being the live version.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on automatically the first time, so nobody has to
          # click through repository Settings.
          enablement: true

      # Pages sends Cache-Control: max-age=600 on everything and offers no way
      # to change it, so for ten minutes after a deploy a returning visitor can
      # be mixing new files with cached old ones. Stamping the commit sha onto
      # each code URL makes every deploy a fresh set of URLs. This runs on the
      # runner's throwaway checkout only — the repository is never modified,
      # and ?v= never shows up in a diff.
      - name: Stamp the version onto the code URLs
        run: python3 tools/stamp-version.py "${GITHUB_SHA::12}"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repository. The action already excludes .git and .github.
          # assets/source-panoramas/ is included deliberately: the originals are
          # published alongside the tour. Add an exclusion here if that ever
          # needs to change.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
